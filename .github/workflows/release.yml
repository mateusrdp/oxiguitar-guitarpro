# Test builds and releases (#165). The work is oxiguitar's reusable workflow
# plugin-release.yml: it runs build-oxp.sh on Linux (x86_64, ARM64), Windows
# (x86_64, ARM64) and macOS and makes, from the five plugin files, a zip per
# target, a .deb and an .rpm (oxiguitar-guitarpro), a per-user Windows
# installer, a macOS .pkg and SHA256SUMS.
#
# - On a pull request, and on a push to develop or main: nothing is
#   released. The files stay under the run for 14 days, with a ~dev version;
#   those are the test builds.
# - On a pushed v* tag (only the maintainer makes them; v plus the version in
#   Cargo.toml): a DRAFT release holding all of it. Publishing the draft
#   starts publish.yml.
name: Release

on:
  pull_request:
  push:
    branches: [develop, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    uses: mateusrdp/oxiguitar/.github/workflows/plugin-release.yml@plugin-release-several-files
    with:
      name: guitarpro
      title: "Guitar Pro (3, 4, 5, 6, 7-8)"
      description: "Opens Guitar Pro 3, 4, 5, 6 and 7-8 files, and saves Guitar Pro 5 and 7-8."
      # The workspace has five plugin crates; they share one version.
      package: oxiguitar-gp3-plugin
      # ci.yml has run the tests on six systems.
      test: false
      # The packaging scripts come from the same commit of oxiguitar.
      tools-ref: plugin-release-several-files
    permissions:
      contents: write
